[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --strict-markers
markers =
    crud: Employee and Attendance CRUD operations
    auth: Authentication and JWT lifecycle tests
    rbac: Role-based access control tests
    boundary: Field boundary validation tests
    schema: JSON schema compliance tests
    latency: API response time assertions under 300ms
